name: analytics
profile: analytics
version: 1.0.0
require-dbt-version: [">=2.0.0", "<3.0.0"]
model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots
clean-targets:
  - target
  - dbt_packages

# Keep the rows behind every failing test, so `just failures` can show them
# no matter which command ran the tests.
data_tests:
  +store_failures: true

# Configuration cascades by folder. A `config()` block inside a model file is
# therefore an exception worth noticing, not boilerplate.
models:
  analytics:
    staging:
      +materialized: view
      +schema: staging
      bbc_sport:
        +tags:
          - bbc_sport
    intermediate:
      # Views rather than `ephemeral` so intermediate results stay inspectable
      # in the warehouse.
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      +tags:
        - wsl

flags:
  require_generic_test_arguments_property: true
