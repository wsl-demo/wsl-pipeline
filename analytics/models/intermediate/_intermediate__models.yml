models:
  - name: int_matches_unioned_with_fixtures
    description: |
      Every match, played or scheduled, with everything that follows from the
      match itself: its season, its status, and the league points each side
      earned.

      **Grain:** one row per match (`opta_match_id`, tested unique).

      **What this step does**
      - Combines results (`stg_bbc_sport__matches`) with fixtures
        (`stg_bbc_sport__fixtures`). A fixture and its result share an
        `opta_match_id`, so a match moves from `scheduled` to `played` without
        changing identity; where both exist, the result wins.
      - Assigns each match a season with the `season_of` macro.
      - Awards league points (3 for a win, 1 for a draw, 0 for a loss). A
        football rule rather than a cleanup of the source, so it lives here and
        not in staging.

      **Used by:** `matches`, which publishes it unchanged.
    data_tests:
      - expression_is_true:
          arguments:
            expression: "match_status <> 'played' or (home_points is not null and away_points is not null)"
    columns:
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} Primary key."
        data_tests:
          - unique
          - not_null
      - name: opta_home_team_id
        description: "{{ doc('opta_team_id') }} The home team."
        data_tests:
          - not_null
      - name: opta_away_team_id
        description: "{{ doc('opta_team_id') }} The away team."
        data_tests:
          - not_null
      - name: match_status
        description: "'scheduled' until a result exists, then 'played'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['scheduled', 'played']
      - name: season
        description: "{{ doc('season') }}"
        data_tests:
          - not_null
      - name: winner_side
        description: "'home', 'away' or 'draw'. Null until the match is played."
      - name: tournament_name
        description: Null for a scheduled match; the fixtures page does not carry it.
      - name: venue_name
        description: Null for a scheduled match; the fixtures page does not carry it.
      - name: home_score_fulltime
        description: Goals the home side scored. Null until the match is played.
      - name: away_score_fulltime
        description: Goals the away side scored. Null until the match is played.
      - name: home_points
        description: League points the home side earned (3, 1 or 0). Null until played.
      - name: away_points
        description: League points the away side earned (3, 1 or 0). Null until played.
      - name: match_date
        description: Calendar date of the match in UK local time.
        data_tests:
          - not_null
      - name: kicked_off_at
        description: Kickoff. Null for a scheduled match whose time is still TBC.

  - name: int_players_joined_to_matches
    description: |
      Everyone named in a matchday squad, starters and the whole bench, with
      the match's kickoff and season attached and the player's team keyed on
      Opta's ID.

      **Grain:** one row per player per match (`opta_match_id`,
      `opta_player_id`, tested unique).

      **What this step does**
      - Joins each squad member (`stg_bbc_sport__match_players`) to their
        match (`stg_bbc_sport__matches`) for its kickoff and season.
      - Looks up the team's Opta ID in `stg_bbc_sport__match_teams`, because
        the squad lists only carry BBC's team slug. From here on, BBC's own IDs
        are left behind.
      - Derives `has_appeared`, which separates players who took part from
        unused substitutes.
      - Ranks each player's squad selections, newest first (`recency_rank`), so
        later models can take a player's latest name and shirt number.

      **Used by:** `matchday_squad_members`, `squad_members`, `players` and
      `int_players_starts_aggregated_by_position`.
    data_tests:
      - unique:
          column_name: "opta_match_id || '|' || opta_player_id"
    columns:
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }}"
        data_tests:
          - not_null
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }}"
        data_tests:
          - not_null
      - name: opta_team_id
        description: "{{ doc('opta_team_id') }} The team the player was named for in this match."
        data_tests:
          - not_null
      - name: season
        description: "{{ doc('season') }}"
        data_tests:
          - not_null
      - name: display_name
        description: The name as BBC abbreviates it, e.g. "F. Kirby".
      - name: name_first
        description: The player's first name or names, as BBC gives them for this match.
      - name: name_last
        description: The player's last name, as BBC gives it for this match.
      - name: name_shirt
        description: The name printed on the shirt. Recorded for only some players.
      - name: position
        description: Playing position, null for appearances made as a substitute.
      - name: shirt_number
        description: Shirt number worn in this match.
      - name: is_starter
        description: True for the starting eleven; false for the bench.
      - name: is_captain
        description: True for the team's captain in this match.
      - name: has_appeared
        description: >
          True for starters and for substitutes who came on; false for unused
          bench. Unused bench are still part of the squad for the match.
        data_tests:
          - not_null
      - name: kicked_off_at
        description: Kickoff, carried from stg_bbc_sport__matches.
        data_tests:
          - not_null
      - name: recency_rank
        description: >
          1 for the player's latest squad selection. Ties are broken on opta_match_id
          so the ordering is deterministic.
        data_tests:
          - not_null

  - name: int_players_starts_aggregated_by_position
    description: |
      How often each player started in each position, counted separately for
      each team and season, because a player can change both.

      **Grain:** one row per season, team, player and position started in
      (tested unique).

      **What this step does:** counts the starts in
      `int_players_joined_to_matches` and keeps the latest kickoff of each,
      which breaks ties when two positions have the same count. Substitute
      appearances are left out, because BBC records no position for them.

      **Used by:** `squad_members`, to pick each player's
      `most_common_start_position`.
    data_tests:
      - unique:
          column_name: "season || '|' || opta_team_id || '|' || opta_player_id || '|' || position"
    columns:
      - name: season
        description: "{{ doc('season') }}"
        data_tests:
          - not_null
      - name: opta_team_id
        description: "{{ doc('opta_team_id') }}"
        data_tests:
          - not_null
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }}"
        data_tests:
          - not_null
      - name: position
        description: Playing position. Never null, since only starts are counted.
        data_tests:
          - not_null
      - name: starts
        description: Number of matches the player started in this position.
        data_tests:
          - not_null
      - name: last_started_at
        description: >
          Kick-off of the most recent start in this position. Used to break ties
          when two positions have an equal number of starts.
        data_tests:
          - not_null

  - name: int_player_match_stats_pivoted
    description: |
      Each player's statistics for a match as columns, one row per squad
      member. This is where BBC's statistic names become the column names used
      from here to the marts.

      **Grain:** one row per player per match (`opta_match_id`,
      `opta_player_id`, tested unique).

      **What this step does**
      - Pivots `stg_bbc_sport__player_match_stats` from one row per statistic
        to one column per statistic. The statistics are listed by name;
        staging tests `stat_name` against the same list, so a new or renamed
        statistic fails that test instead of silently going missing here.
      - Renames each statistic. Most names translate directly; the one that
        does not is `totalAssists`, which BBC labels "Chances created" and
        which becomes `chances_created`.
      - Casts counts to integers, guarded by
        `player_count_stats_are_whole_numbers`; the two percentages stay
        fractional.

      **Not carried over:** `penaltySave` and `penaltyMiss`, which BBC shows
      only for a player who saved or missed a penalty.

      **Nulls:** a statistic BBC doesn't show for a player is null, not zero.
      Each column says who it is null for.

      **Used by:** `matchday_squad_members`.
    data_tests:
      - unique:
          column_name: "opta_match_id || '|' || opta_player_id"
    columns:
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }}"
        data_tests:
          - not_null
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }}"
        data_tests:
          - not_null
      - name: minutes_played
        description: "{{ doc('minutes_played') }}"
      - name: goals
        description: "{{ doc('goals') }}"
      - name: assists
        description: "{{ doc('assists') }}"
      - name: chances_created
        description: "{{ doc('chances_created') }}"
      - name: shots_total
        description: "{{ doc('shots_total') }}"
      - name: shots_on_target
        description: "{{ doc('shots_on_target') }}"
      - name: saves
        description: "{{ doc('saves') }}"
      - name: total_passes
        description: "{{ doc('total_passes') }}"
      - name: pass_accuracy_percent
        description: "{{ doc('pass_accuracy_percent') }}"
      - name: total_tackles
        description: "{{ doc('total_tackles') }}"
      - name: tackles_won_percent
        description: "{{ doc('tackles_won_percent') }}"
      - name: fouls_committed
        description: "{{ doc('fouls_committed') }}"
      - name: fouls_won
        description: "{{ doc('fouls_won') }}"
