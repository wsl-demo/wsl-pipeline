models:
  - name: int_player_match_stats_pivoted
    description: |
      Each player's statistics for a match as columns, one row per squad
      member. This is where BBC's statistic names become the column names used
      from here to the marts.

      **Grain:** one row per player per match (`opta_match_id`,
      `opta_player_id`, tested unique).
    data_tests:
      - unique:
          column_name: "opta_match_id || '|' || opta_player_id"
    columns:
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }}"
        data_tests:
          - not_null
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }}"
        data_tests:
          - not_null
      - name: minutes_played
        description: "Minutes the player was on the pitch, from BBC's `minsPlayed`. Never more than 90, so added time is not counted. Null for an unused substitute."
      - name: goals
        description: "Goals the player scored, from BBC's `goals`. Penalties count and own goals do not. Null for a starting goalkeeper."
      - name: assists
        description: "Assists, from BBC's `assists`. Null for a starting goalkeeper."
      - name: chances_created
        description: "From BBC's `totalAssists`, which BBC labels \"Chances created\"; the column follows the label. Never lower than `assists`, so assists count as chances created. Null for a starting goalkeeper."
      - name: shots_total
        description: "Shots, on and off target, from BBC's `shotsTotal`. Null for a starting goalkeeper."
      - name: shots_on_target
        description: "Shots on target, from BBC's `shotsOnTarget`. Never more than `shots_total`. Null for a starting goalkeeper."
      - name: saves
        description: "Shots saved, from BBC's `shotsSaved`. Recorded only for starting goalkeepers; null for everyone else."
      - name: total_passes
        description: "Passes, from BBC's `totalPass`."
      - name: pass_accuracy_percent
        description: "Share of the player's passes BBC counts as accurate, from 0 to 100, from BBC's `accuratePassPercentage`."
      - name: total_tackles
        description: "Tackles, from BBC's `totalTackle`. Null for most starting goalkeepers."
      - name: tackles_won_percent
        description: "Share of the player's tackles won, from 0 to 100, from BBC's `wonTacklePercentage`. Null for most starting goalkeepers."
      - name: fouls_committed
        description: "Fouls the player committed, from BBC's `fouls`."
      - name: fouls_won
        description: "Times the player was fouled, from BBC's `wasFouled`."
