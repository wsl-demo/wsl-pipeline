models:
  - name: stg_bbc_sport__team_match_stats
    description: >
      One row per team per match per statistic. Kept in the source's long shape;
      there are 46 distinct statistics, so pivoting is left to whichever
      downstream model needs a specific subset.
    data_tests:
      - unique:
          column_name: "bbc_match_id || '|' || bbc_team_id || '|' || stat_name"
    columns:
      - name: bbc_match_id
        description: "BBC's match ID: the match URN without its prefix, `s-` followed by Opta's match ID."
        data_tests:
          - not_null
      - name: opta_match_id
        description: "Opta's match ID: bbc_match_id without its `s-` prefix. Null if bbc_match_id is not `s-` prefixed. Foreign key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: bbc_team_id
        description: "BBC's team ID: the team URN without its prefix, a slug such as `arsenal-ladies`. Not an Opta ID."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: alignment
      - name: stat_name
        description: Dotted path the source uses to name the statistic.
        data_tests:
          - not_null
      - name: stat_measure
        description: >
          Always "total" in the data observed so far. Tested so that a new
          measure type, such as a per-half breakdown, is noticed rather than
          silently doubling the grain.
        data_tests:
          - accepted_values:
              arguments:
                values: ['total']
      - name: stat_value
        data_tests:
          - not_null
