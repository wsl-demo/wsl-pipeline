models:
  - name: stg_bbc_sport__team_match_stats
    description: |
      Each team's statistics for each match, in the source's long shape: one
      row per statistic (raw `bbc_sport.team_match_stats`). There are 47
      statistics, so pivoting is left to whichever downstream model needs a
      specific subset.

      **Grain:** one row per team per match per statistic (`bbc_match_id`,
      `bbc_team_id`, `stat_name`, tested unique).

      **What staging changes:** URN prefixes removed; Opta's match ID derived
      from BBC's; `stat_value` cast from text; columns renamed.

      **Not carried over:** `source_match_id` (BBC's page slug, on
      `stg_bbc_sport__matches`).

      **Duplicated statistics:** five statistics appear twice, once at the top
      level and once inside a group, with the same value every time:
      `shotsTotal` / `attack.shotsTotal`, `shotsOnTarget` /
      `attack.shotsOnTarget`, `foulsCommitted` / `defence.foulsCommitted`,
      `shotsSaved` / `goalkeeper.shotsSaved` and `touchesInBox` /
      `distribution.touchesInBox`. Pick one form when summing.
    data_tests:
      - unique:
          column_name: "bbc_match_id || '|' || bbc_team_id || '|' || stat_name"
    columns:
      - name: bbc_match_id
        description: "{{ doc('bbc_match_id') }} From raw `match_urn`, with the `urn:bbc:sportsdata:football:event:` prefix removed by `strip_urn`."
        data_tests:
          - not_null
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} {{ doc('opta_id_from_bbc_id') }} Foreign key to `stg_bbc_sport__matches`."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: bbc_team_id
        description: "{{ doc('bbc_team_id') }} From raw `team_urn`, with the `urn:bbc:sportsdata:football:team:` prefix removed by `strip_urn`."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: alignment
        description: "`home` or `away`. From raw `alignment`, as sent."
      - name: stat_name
        description: >
          Name of the statistic. From raw `stat_path`, as sent: most are
          `group.name` (`attack.shotsTotal`, `defence.wonTackle`,
          `distribution.totalPass`, `goalkeeper.divingSave`), a few have no
          group (`possessionPercentage`, `cornersWon`, `subsMade`).
        data_tests:
          - not_null
      - name: stat_measure
        description: >
          From raw `stat_measure`, as sent. Always "total" in the data observed
          so far. Tested so that a new measure type, such as a per-half
          breakdown, is noticed rather than silently doubling the grain.
        data_tests:
          - accepted_values:
              arguments:
                values: ['total']
      - name: stat_value
        description: The statistic's value. From raw `stat_value`, cast to double. Percentages (`possessionPercentage`, `*Percentage`) are 0–100.
        data_tests:
          - not_null
