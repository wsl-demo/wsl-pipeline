models:
  - name: stg_bbc_sport__match_players
    description: |
      Everyone named in each team's matchday squad: the starting eleven and the
      bench (raw `bbc_sport.match_players`), with each player's substitution
      if they had one.

      **Grain:** one row per player per match (`bbc_match_id`,
      `bbc_player_id`, tested unique).

      **What staging changes**
      - IDs: URN prefixes removed; Opta IDs derived from BBC's, including for
        the players in each substitution.
      - `position` is nulled for the bench, where BBC writes "Substitute".
      - Two text fields become flags (`is_starter`, `is_captain`).
      - The substitution clock (`63:57`) is turned into seconds, the minute
        being played, and that minute split into regulation and added time.

      **Not carried over**
      - Repeats of a staged column: `teamUrn` (= `team_urn`), `name_short`
        (= `displayName`), `source_match_id` (BBC's page slug, on
        `stg_bbc_sport__matches`).
      - Names held elsewhere: `teamName`, `substitutedOn_playerOffName`,
        `substitutedOff_playerOnName` (join on the player IDs instead).
      - Other forms of the substitution time: `substitutedOn_timeMin`,
        `substitutedOff_timeMin` (the minute as displayed, e.g. `90'+3`) and
        `substitutedOn_timestamp`, `substitutedOff_timestamp` (wall-clock
        time). Staging derives everything from `*_timeMinSec` instead.
      - Cards: `card_type_*` and `card_time_*` (see
        `stg_bbc_sport__match_player_cards`). `accessibleText`
        (screen-reader text).

      **Reading substitutions:** each substitution appears twice, once on
      the player who went off (`substituted_off_*`) and once on the player who
      came on (`substituted_on_*`), with the same time on both.
    data_tests:
      - expression_is_true:
          arguments:
            # A starter can't be substituted on
            expression: "NOT is_starter OR substituted_on_period IS NULL"
      # A player can only be on the match roster 1 time
      - unique:
          column_name: "bbc_match_id || '|' || bbc_player_id"
    columns:
      - name: bbc_match_id
        description: "{{ doc('bbc_match_id') }}"
        data_tests:
          - not_null
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: bbc_team_id
        description: "{{ doc('bbc_team_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: bbc_player_id
        description: "{{ doc('bbc_player_id') }}"
        data_tests:
          - not_null
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          # Fails for a BBC player ID without its `s-`, which derives to null.
          - not_null
      - name: display_name
        description: "{{ doc('display_name') }}"
      - name: name_first
        description: "{{ doc('name_first') }}"
      - name: name_last
        description: "{{ doc('name_last') }}"
      - name: name_shirt
        description: "{{ doc('name_shirt') }}"
      - name: position
        description: "{{ doc('position') }}"
        data_tests:
          # Guards the downstream position aggregation: a renamed or newly
          # added position fails here instead of silently disappearing.
          - accepted_values:
              arguments:
                values:
                  - Goalkeeper
                  - Defender
                  - Defensive Midfielder
                  - Wing Back
                  - Midfielder
                  - Attacking Midfielder
                  - Striker
      - name: shirt_number
        description: "{{ doc('shirt_number') }}"
      # is_starter and is_captain are CASE ... ELSE false, so they are
      # non-nullable by construction and a not_null test could never fail.
      - name: is_starter
        description: "{{ doc('is_starter') }}"
      - name: is_captain
        description: "{{ doc('is_captain') }}"
      - name: formation_place
        description: "A starter's place in the formation, 1 to 11. Null for the bench."
      #
      # (starter) substituted off
      - name: substituted_off_reason
        description: "{{ doc('substituted_off_reason') }}"
      - name: bbc_substituted_off_for_player_id
        description: "{{ doc('bbc_player_id') }} The player who came on for this one."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: bbc_player_id
      - name: opta_substituted_off_for_player_id
        description: "{{ doc('opta_player_id') }} {{ doc('opta_id_from_bbc_id') }} The player who came on for this one."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: substituted_off_period
        description: "Period of the match the player was taken off in."
      - name: substituted_off_minute
        description: "The minute being played when the player was taken off, counted from kickoff, so `63:57` on the match clock is the 64th minute and `45:00` the 46th. Null if they weren't taken off."
      - name: substituted_off_regulation_time
        description: >
          `substituted_off_minute` capped at the end of its period (45, 90, 105
          or 120), so a substitution in the 94th minute of the second half
          gives 90.
      - name: substituted_off_injury_time
        description: Minutes past the end of the period, so the 94th minute of the second half gives 4. Zero within regulation time.
      - name: raw_substituted_off_min_sec
        description: "Match clock when the player was taken off, `mm:ss` from kickoff, e.g. `63:57`."
      - name: substituted_off_time_seconds
        description: "`raw_substituted_off_min_sec` in seconds from kickoff: `63:57` gives 3837."
        data_tests:
          - not_null:
              config:
                where: "substituted_off_period is not null"
      #
      # (sub) substituted on
      - name: substituted_on_reason
        description: "{{ doc('substituted_on_reason') }}"
      - name: bbc_substituted_on_for_player_id
        description: "{{ doc('bbc_player_id') }} The player this one replaced."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: bbc_player_id
      - name: opta_substituted_on_for_player_id
        description: "{{ doc('opta_player_id') }} {{ doc('opta_id_from_bbc_id') }} The player this one replaced."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: substituted_on_period
        description: "Period of the match the player came on in."
      - name: substituted_on_minute
        description: "The minute being played when the player came on, counted from kickoff, so `63:57` on the match clock is the 64th minute. Null if they didn't come on."
      - name: substituted_on_regulation_time
        description: "`substituted_on_minute` capped at the end of its period, like `substituted_off_regulation_time`."
      - name: substituted_on_injury_time
        description: Minutes past the end of the period, like `substituted_off_injury_time`.
      - name: raw_substituted_on_min_sec
        description: "Match clock when the player came on, `mm:ss` from kickoff, e.g. `63:57`."
      - name: substituted_on_time_seconds
        description: "`raw_substituted_on_min_sec` in seconds from kickoff."
        data_tests:
          - not_null:
              config:
                where: "substituted_on_period is not null"
