models:
  - name: stg_bbc_sport__match_players
    description: Team roster for a match. One row per player per match.
    data_tests:
      - expression_is_true:
          arguments:
            # A starter can't be substituted on
            expression: "NOT is_starter OR substituted_on_period IS NULL"
      # A player can only be on the match roster 1 time
      - unique:
          column_name: "bbc_match_id || '|' || bbc_player_id"
    columns:
      - name: bbc_match_id
        description: "BBC's match ID: the match URN without its prefix, `s-` followed by Opta's match ID."
        data_tests:
          - not_null
      - name: opta_match_id
        description: "Opta's match ID: bbc_match_id without its `s-` prefix. Null if bbc_match_id is not `s-` prefixed. Foreign key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: bbc_team_id
        description: "BBC's team ID: the team URN without its prefix, a slug such as `arsenal-ladies`. Not an Opta ID."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: bbc_player_id
        description: "BBC's player ID: the player URN without its prefix, `s-` followed by Opta's player ID."
        data_tests:
          - not_null
      - name: opta_player_id
        description: >
          Opta's player ID: bbc_player_id without its `s-` prefix. The key shared
          with wsl_football's squad data. Null if bbc_player_id is not `s-`
          prefixed, which the not_null test turns into a failure.
        data_tests:
          - not_null
      - name: display_name
      - name: name_first
      - name: name_last
      - name: name_shirt
      - name: position
        description: >
          Playing position, for starters only. The source writes 'Substitute'
          here for everyone on the bench, which is roster status rather than a
          position, so it is nulled out; use is_starter for that instead.
        data_tests:
          # Guards the downstream position aggregation: a renamed or newly
          # added position fails here instead of silently disappearing.
          - accepted_values:
              arguments:
                values:
                  - Goalkeeper
                  - Defender
                  - Defensive Midfielder
                  - Wing Back
                  - Midfielder
                  - Attacking Midfielder
                  - Striker
      - name: shirt_number
      # is_starter and is_captain are CASE ... ELSE false, so they are
      # non-nullable by construction and a not_null test could never fail.
      - name: is_starter
      - name: is_captain
      - name: formation_place
      #
      # (starter) substituted off
      - name: substituted_off_reason
      - name: bbc_substituted_off_for_player_id
        description: "BBC's player ID of the player who came on for this one."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: bbc_player_id
      - name: opta_substituted_off_for_player_id
        description: "Opta's player ID of the player who came on for this one."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: substituted_off_period
      - name: substituted_off_minute
      - name: substituted_off_regulation_time
      - name: substituted_off_injury_time
      - name: raw_substituted_off_min_sec
      - name: substituted_off_time_seconds
        data_tests:
          - not_null:
              config:
                where: "substituted_off_period is not null"
      #
      # (sub) substituted on
      - name: substituted_on_reason
      - name: bbc_substituted_on_for_player_id
        description: "BBC's player ID of the player this one replaced."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: bbc_player_id
      - name: opta_substituted_on_for_player_id
        description: "Opta's player ID of the player this one replaced."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: substituted_on_period
      - name: substituted_on_minute
      - name: substituted_on_regulation_time
      - name: substituted_on_injury_time
      - name: raw_substituted_on_min_sec
      - name: substituted_on_time_seconds
        data_tests:
          - not_null:
              config:
                where: "substituted_on_period is not null"
