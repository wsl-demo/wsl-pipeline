models:
  - name: stg_bbc_sport__matches
    description: One row per match.
    columns:
      - name: match_id
        description: >
          ID of the match: BBC's match URN without its prefix (BBC calls matches
          "events"). Known before a match is played, so scheduled fixtures use
          the same ID. Primary key.
        data_tests:
          - unique
          - not_null
      - name: kicked_off_at
        data_tests:
          - not_null
      - name: tournament_name
        data_tests:
          - not_null
      - name: tournament_id
        data_tests:
          - not_null
      - name: venue_name
        data_tests:
          - not_null
      - name: venue_id
        data_tests:
          - not_null
      - name: attendance_count
      # is_regular_season and is_full_time are CASE ... ELSE false, so they are
      # non-nullable by construction and a not_null test could never fail.
      - name: is_regular_season
      - name: is_full_time
      - name: home_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: team_id
      - name: home_opta_team_id
        description: Opta's ID of the home team, which BBC calls its participant ID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: opta_team_id
      - name: home_score_halftime
        data_tests:
          - not_null
      - name: home_score_fulltime
        data_tests:
          - not_null
      - name: away_team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: team_id
      - name: away_opta_team_id
        description: Opta's ID of the away team, which BBC calls its participant ID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: opta_team_id
      - name: away_score_halftime
        data_tests:
          - not_null
      - name: away_score_fulltime
        data_tests:
          - not_null
      - name: winner_side
        description: Which side won, or `draw`, as reported by the source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away', 'draw']
