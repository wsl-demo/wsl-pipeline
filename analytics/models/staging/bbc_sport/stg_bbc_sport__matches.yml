models:
  - name: stg_bbc_sport__matches
    description: |
      Played matches, one per BBC match page (raw `bbc_sport.matches`): when and
      where, which teams, and the score.

      **Grain:** one row per match (`opta_match_id`, tested unique).

      **What staging changes**
      - IDs: URN prefixes removed; Opta's match ID derived from BBC's. BBC sends
        Opta's tournament, stage and team IDs as their own columns, which are
        renamed.
      - Scores and attendance are cast from text.
      - Kickoff is built from the date and time the page displays, read as UK
        local time.
      - Two text fields become flags (`is_regular_season`, `is_full_time`).

      **Not carried over**
      - Repeats of a staged column: `tournament_name` and
        `tournamentDescriptionLabel` (= `tournament_name` here), `home_score` and
        `away_score` (= the full-time scores), `venue_id` (= `bbc_venue_id`
        without its `s-`), `stage_urn` (always empty).
      - Other forms of the kickoff: `startDateTime` (unreliable; see
        `kicked_off_at`), `time_accessibleTime` (screen-reader text) and
        `time_timeCertainty` (true for every match).
      - Team names: `home_fullName`, `home_shortName`, `away_fullName`,
        `away_shortName` (in `stg_bbc_sport__match_teams`).
      - Match state, which is the same for every finished match: `status`,
        `period`, `periodLabel_accessible`, `live`, `home_scoreUnconfirmed`,
        `away_scoreUnconfirmed`.
      - Page furniture: `title`, `accessibleEventSummary`, `headerImage`,
        `lastUpdatedString`, `seoTimestamps_*`, `mediaHeaderData_*`, `type`,
        `sportDiscipline`, `venue_shortName`, `tournament_thingsGuid`, and
        `groupedActions` (a JSON summary of the page's goals and assists).
      - Providence metadata: `source_month`, `source_fetched_at`, `source_file`.
    columns:
      - name: bbc_match_id
        description: "{{ doc('bbc_match_id') }}"
        data_tests:
          - unique
          - not_null
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - unique
          - not_null
      - name: bbc_match_page_id
        description: "{{ doc('bbc_match_page_id') }}"
        data_tests:
          - unique
          - not_null
      - name: kicked_off_at
        description: "{{ doc('kicked_off_at') }}"
        data_tests:
          - not_null
      - name: tournament_name
        description: "{{ doc('tournament_name') }}"
        data_tests:
          - not_null
      - name: bbc_tournament_id
        description: "BBC's tournament ID: a slug, `womens-super-league`. It does not contain Opta's ID, so Opta's competition ID cannot be derived from it."
        data_tests:
          - not_null
      - name: opta_tournament_id
        description: "{{ doc('opta_tournament_id') }}"
        data_tests:
          - not_null
      - name: opta_stage_id
        description: "Opta's stage ID. Each season's league is one \"Regular Season\" stage, so it identifies the season in Opta's terms."
        data_tests:
          - not_null
      - name: venue_name
        description: "{{ doc('venue_name') }} Group by `bbc_venue_id`, not by name."
        data_tests:
          - not_null
      - name: bbc_venue_id
        description: "BBC's venue ID: `s-` followed by an ID that is probably Opta's but unconfirmed."
        data_tests:
          - not_null
      - name: attendance_count
        description: "Crowd size, e.g. `3302`. Missing for 3 matches."
      # is_regular_season and is_full_time are CASE ... ELSE false, so they are
      # non-nullable by construction and a not_null test could never fail.
      - name: is_regular_season
        description: "True for a match in Opta's \"Regular Season\" stage, which every match so far is."
      - name: is_full_time
        description: "True when BBC labels the score full time (`FT`), which it does for every match so far: its results pages list only finished matches."
      - name: bbc_home_team_id
        description: "{{ doc('bbc_team_id') }} The home team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: opta_home_team_id
        description: "{{ doc('opta_team_id') }} The home team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: opta_team_id
      - name: home_score_halftime
        description: "{{ doc('score_halftime') }} The home team."
        data_tests:
          - not_null
      - name: home_score_fulltime
        description: "{{ doc('score_fulltime') }} The home team."
        data_tests:
          - not_null
      - name: bbc_away_team_id
        description: "{{ doc('bbc_team_id') }} The away team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: opta_away_team_id
        description: "{{ doc('opta_team_id') }} The away team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: opta_team_id
      - name: away_score_halftime
        description: "{{ doc('score_halftime') }} The away team."
        data_tests:
          - not_null
      - name: away_score_fulltime
        description: "{{ doc('score_fulltime') }} The away team."
        data_tests:
          - not_null
      - name: winner_side
        description: "{{ doc('winner_side') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away', 'draw']
