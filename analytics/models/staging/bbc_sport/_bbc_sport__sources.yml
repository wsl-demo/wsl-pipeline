version: 2

# Each table declares only the raw columns the project uses, each as varchar:
# ingestion loads every CSV with `all_varchar = true`. dbt_project.yml sets
# `schema_origin: local` for all sources, so dbt reads these declarations instead
# of querying the warehouse, which lets the docs build in CI without the data. A
# model that starts using an undeclared column fails strict compilation until
# the column is added here.
#
# Descriptions here say what BBC sends and in what form. What a column means,
# and how staging transforms it, is on the staging model built from it.

sources:
  - name: bbc_sport
    description: >
      Women's Super League match data sourced from BBC Sport: each played
      match's page, and the fixtures page for matches still to come.
    schema: raw
    loader: just setup
    tables:
      - name: matches
        description: One row per played match, from its BBC match page. Staged by `stg_bbc_sport__matches`.
        config:
          loaded_at_field: "cast(source_fetched_at as timestamptz)"
        columns:
          - name: source_match_id
            data_type: varchar
            description: "{{ doc('bbc_match_page_id') }}"
            data_tests:
              - unique
              - not_null
          - name: urn
            data_type: varchar
            description: "{{ doc('raw_match_urn') }}"
            data_tests:
              - unique
              - not_null
          - name: startDateTime
            data_type: varchar
            description: >
              An ISO 8601 UTC timestamp BBC labels as the start time, e.g.
              `2023-10-21T11:30:00.000Z`. Unreliable: for 66 of 431 matches it
              disagrees with the kickoff the page displays, and the
              substitution timestamps show the displayed one is right. Not used
              by staging.
            data_tests:
              - not_null
          - name: date
            data_type: varchar
            description: The match date as displayed, e.g. `Sat 21 Oct 2023`.
            data_tests:
              - not_null
          - name: time_displayTimeUK
            data_type: varchar
            description: The kickoff time as displayed, in UK local time, e.g. `12:30`.
            data_tests:
              - not_null
          - name: tournament_urn
            data_type: varchar
            description: "BBC's tournament URN: `urn:bbc:sportsdata:football:tournament:womens-super-league`."
          - name: stage_name
            data_type: varchar
            description: Name of the competition stage; `Regular Season` for every match so far.
          - name: periodLabel_value
            data_type: varchar
            description: The match state BBC labels the score with; `FT` (full time) for every match, as the table holds only finished matches.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['FT']
          - name: winner
            data_type: varchar
            description: "{{ doc('winner_side') }}"
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['home', 'away', 'draw']
          - name: home_urn
            data_type: varchar
            description: "{{ doc('raw_team_urn') }} The home team."
          - name: home_runningScores_halftime
            data_type: varchar
            description: "{{ doc('score_halftime') }} The home team."
          - name: home_runningScores_fulltime
            data_type: varchar
            description: "{{ doc('score_fulltime') }} The home team."
          - name: away_urn
            data_type: varchar
            description: "{{ doc('raw_team_urn') }} The away team."
          - name: away_runningScores_halftime
            data_type: varchar
            description: "{{ doc('score_halftime') }} The away team."
          - name: away_runningScores_fulltime
            data_type: varchar
            description: "{{ doc('score_fulltime') }} The away team."
          - name: venue_name
            data_type: varchar
            description: "{{ doc('venue_name') }}"
          - name: attendance_value
            data_type: varchar
            description: "Crowd size, e.g. `3302`. Missing for 3 matches."
          - name: home_id
            data_type: varchar
            description: "{{ doc('opta_team_id') }} The home team."
          - name: away_id
            data_type: varchar
            description: "{{ doc('opta_team_id') }} The away team."
          - name: tournament_id
            data_type: varchar
            description: "{{ doc('opta_tournament_id') }}"
          - name: tournament_disambiguatedName
            data_type: varchar
            description: "{{ doc('tournament_name') }}"
          - name: stage_id
            data_type: varchar
            description: "Opta's stage ID. Each season's league is one \"Regular Season\" stage, so it identifies the season in Opta's terms."
          - name: venue_urn
            data_type: varchar
            description: "BBC's venue URN: `urn:bbc:sportsdata:football:venue:` followed by `s-` and an ID."
          - name: source_fetched_at
            data_type: varchar
            description: "When the data was fetched, as an ISO timestamp. The source's `loaded_at_field`."

      - name: match_actions
        description: >
          The goals and sendings-off listed under each team on a BBC match page,
          one row per action. BBC numbers the players who acted for each side
          (`action_index`) and each player's actions (`sub_index`). Staged by
          `stg_bbc_sport__match_actions`, which also explains how to read own
          goals and the goal types.
        data_tests:
          - unique:
              column_name: "match_urn || '|' || source_side || '|' || action_index || '|' || sub_index"
              description: One row per action, as described in the table's grain.
        columns:
          - name: source_match_id
            data_type: varchar
            description: "{{ doc('bbc_match_page_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('bbc_sport', 'matches')
                    field: source_match_id
          - name: match_urn
            data_type: varchar
            description: "{{ doc('raw_match_urn') }}"
          - name: source_side
            data_type: varchar
            description: "`home` or `away`: the side the action is listed under."
          - name: team_urn
            data_type: varchar
            description: "{{ doc('raw_team_urn') }} The side the action is listed under; for an own goal, the team it counts for."
            data_tests:
              - not_null
          - name: action_index
            data_type: varchar
            description: "Position of the acting player in their side's list of actions, from 0."
          - name: sub_index
            data_type: varchar
            description: "Position of the action among that player's actions, from 0."
          - name: playerUrn
            data_type: varchar
            description: "{{ doc('raw_player_urn') }}"
          - name: playerName
            data_type: varchar
            description: "{{ doc('display_name') }}"
          - name: actionType
            data_type: varchar
            description: "Broad kind of action: `goal` or `card`."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['goal', 'card']
          - name: type
            data_type: varchar
            description: >
              Specific kind of action: `Goal`, `Own Goal`, `Penalty`, `Red Card`
              or `Two Yellow Cards`. The test also accepts `Yellow Card`, which
              has not appeared: single yellows are listed only in
              `match_player_cards`.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['Goal', 'Own Goal', "Red Card", "Two Yellow Cards", "Penalty", "Yellow Card"]
          - name: typeLabel_value
            data_type: varchar
            description: Display label for `type`. Identical to `type` in all data observed.
          - name: typeLabel_accessible
            data_type: varchar
            description: Screen-reader label for `type`. Identical to `type` in all data observed.
          - name: timeLabel_value
            data_type: varchar
            description: "The match minute as displayed: `13'`, or `90'+4` with any added time after the `+`."
          - name: timeLabel_accessible
            data_type: varchar
            description: Screen-reader form of `timeLabel_value`, e.g. "90 minutes plus 4".

      - name: match_officials
        description: The officials listed on a BBC match page; in practice only the referee, one row per match. Staged by `stg_bbc_sport__match_officials`.
        columns:
          - name: source_match_id
            data_type: varchar
            description: "{{ doc('bbc_match_page_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('bbc_sport', 'matches')
                    field: source_match_id
          - name: match_urn
            data_type: varchar
            description: "{{ doc('raw_match_urn') }}"
          - name: id
            data_type: varchar
            description: "BBC's official URN: `urn:bbc:sportsdata:football:official:` followed by an ID, with no `s-`."
          - name: opId
            data_type: varchar
            description: "A short numeric ID BBC sends for 4 of the 45 referees, null for the rest; what issues it is unconfirmed."
          - name: firstName
            data_type: varchar
            description: "The match official's first name."
          - name: lastName
            data_type: varchar
            description: "The match official's last name."

      - name: match_pitch_layout
        description: Each starter's place on the pitch graphic of a BBC match page, one row per starter per match. Staged by `stg_bbc_sport__match_pitch_layout`.
        columns:
          - name: source_match_id
            data_type: varchar
            description: "{{ doc('bbc_match_page_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('bbc_sport', 'matches')
                    field: source_match_id
          - name: match_urn
            data_type: varchar
            description: "{{ doc('raw_match_urn') }}"
          - name: source_side
            data_type: varchar
            description: "{{ doc('source_side') }}"
          - name: team_urn
            data_type: varchar
            description: "{{ doc('raw_team_urn') }}"
            data_tests:
              - not_null
          - name: row_index
            data_type: varchar
            description: "The line of the formation the player is in, from the back: 0 is always the goalkeeper, 1 the defenders and wing backs, and higher rows further forward."
          - name: slot_index
            data_type: varchar
            description: "The player's place within their line of the formation, from 0."
          - name: urn
            data_type: varchar
            description: "{{ doc('raw_player_urn') }}"
            data_tests:
              - not_null

      - name: match_player_cards
        description: The cards shown on a BBC match page, one row per card. Staged by `stg_bbc_sport__match_player_cards`.
        columns:
          - name: source_match_id
            data_type: varchar
            description: "{{ doc('bbc_match_page_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('bbc_sport', 'matches')
                    field: source_match_id
          - name: match_urn
            data_type: varchar
            description: "{{ doc('raw_match_urn') }}"
          - name: team_urn
            data_type: varchar
            description: "{{ doc('raw_team_urn') }} The carded player's team."
            data_tests:
              - not_null
          - name: playerUrn
            data_type: varchar
            description: "{{ doc('raw_player_urn') }}"
            data_tests:
              - not_null
          - name: card_index
            data_type: varchar
            description: "`0` for the player's first card in the match, `1` for a second."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['0', '1']
          - name: type
            data_type: varchar
            description: "`Yellow Card`, `Two Yellow Cards` (a second booking) or `Red Card` (a straight red)."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['Yellow Card', 'Red Card', 'Two Yellow Cards']
          - name: timeLabel_value
            data_type: varchar
            description: "The match minute as displayed: `13'`, or `90'+4` with any added time after the `+`."

      - name: match_players
        description: Each team's matchday squad on a BBC match page, starters and bench, one row per player per match. Staged by `stg_bbc_sport__match_players`.
        columns:
          - name: source_match_id
            data_type: varchar
            description: "{{ doc('bbc_match_page_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('bbc_sport', 'matches')
                    field: source_match_id
          - name: match_urn
            data_type: varchar
            description: "{{ doc('raw_match_urn') }}"
          - name: team_urn
            data_type: varchar
            description: "{{ doc('raw_team_urn') }}"
          - name: source_player_list
            data_type: varchar
            description: "`starters` or `substitutes`: which list on the page the player is in."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['starters', 'substitutes']
          - name: urn
            data_type: varchar
            description: "{{ doc('raw_player_urn') }}"
            data_tests:
              - not_null
          - name: displayName
            data_type: varchar
            description: "{{ doc('display_name') }}"
          - name: name_first
            data_type: varchar
            description: "{{ doc('name_first') }}"
          - name: name_last
            data_type: varchar
            description: "{{ doc('name_last') }}"
          - name: name_shirt
            data_type: varchar
            description: "{{ doc('name_shirt') }}"
          - name: position
            data_type: varchar
            description: Playing position for a starter, e.g. `Defender`; `Substitute` for everyone on the bench.
          - name: shirtNumber
            data_type: varchar
            description: "{{ doc('shirt_number') }}"
          - name: formationPlace
            data_type: varchar
            description: "A starter's place in the formation, 1 to 11. Null for the bench."
          - name: isCaptain
            data_type: varchar
            description: "{{ doc('is_captain') }}"
          - name: substitutedOn_timeMinSec
            data_type: varchar
            description: "Match clock when the player came on, `mm:ss` from kickoff, e.g. `63:57`."
          - name: substitutedOn_periodId
            data_type: varchar
            description: "Period of the match the player came on in."
          - name: substitutedOn_reason
            data_type: varchar
            description: "{{ doc('substituted_on_reason') }}"
          - name: substitutedOn_playerOffUrn
            data_type: varchar
            description: "{{ doc('raw_player_urn') }} For a player who came on, the player they replaced."
          - name: substitutedOff_timeMinSec
            data_type: varchar
            description: "Match clock when the player was taken off, `mm:ss` from kickoff, e.g. `63:57`."
          - name: substitutedOff_periodId
            data_type: varchar
            description: "Period of the match the player was taken off in."
          - name: substitutedOff_reason
            data_type: varchar
            description: "{{ doc('substituted_off_reason') }}"
          - name: substitutedOff_playerOnUrn
            data_type: varchar
            description: "{{ doc('raw_player_urn') }} For a player taken off, the player who came on."
          - name: substitutedOff_timestamp
            data_type: varchar
            description: >
              For a player taken off, the wall-clock time it happened, in UTC,
              e.g. `2025-04-27T12:32:20Z`. Not staged; used by
              `kickoffs_agree_with_substitution_clock` to check kickoff times.

      - name: match_teams
        description: The two teams on a BBC match page, with formation and manager, one row per team per match. Staged by `stg_bbc_sport__match_teams`.
        data_tests:
          - unique:
              column_name: "source_match_id || '|' || source_side"
        columns:
          - name: source_match_id
            data_type: varchar
            description: "{{ doc('bbc_match_page_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('bbc_sport', 'matches')
                    field: source_match_id
          - name: match_urn
            data_type: varchar
            description: "{{ doc('raw_match_urn') }}"
          - name: source_side
            data_type: varchar
            description: "{{ doc('source_side') }}"
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['homeTeam', 'awayTeam']
          - name: urn
            data_type: varchar
            description: "{{ doc('raw_team_urn') }}"
          - name: id
            data_type: varchar
            description: "{{ doc('opta_team_id') }}"
          - name: name_fullName
            data_type: varchar
            description: "{{ doc('team_name') }}"
          - name: name_shortName
            data_type: varchar
            description: "{{ doc('team_short_name') }}"
          - name: name_code
            data_type: varchar
            description: "{{ doc('team_code') }}"
          - name: alignment
            data_type: varchar
            description: "{{ doc('alignment') }}"
          - name: formation_value
            data_type: varchar
            description: "Starting formation as BBC writes it, with spaces around the dashes, e.g. \"4 - 2 - 3 - 1\"."
          - name: manager_id
            data_type: varchar
            description: "BBC's ID for the team's manager in the match, e.g. `btg39qwx8587tn3oieu0ajpbd`. Stable per manager; it looks like an Opta ID but is unconfirmed."
          - name: manager_name_full
            data_type: varchar
            description: "The team manager's full name."

      - name: player_match_stats
        description: >
          The player statistics on a BBC match page, in long form: one row per
          player per match per statistic, keyed by `dataField`. Staged by
          `stg_bbc_sport__player_match_stats`.
        columns:
          - name: source_match_id
            data_type: varchar
            description: "{{ doc('bbc_match_page_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('bbc_sport', 'matches')
                    field: source_match_id
          - name: match_urn
            data_type: varchar
            description: "{{ doc('raw_match_urn') }}"
          - name: team_urn
            data_type: varchar
            description: "{{ doc('raw_team_urn') }}"
          - name: playerUrn
            data_type: varchar
            description: "{{ doc('raw_player_urn') }}"
          - name: stat_index
            data_type: varchar
            description: "Where the statistic comes in the list BBC shows for the player, from 0. Varies by player, because each list holds only the statistics that player has."
          - name: dataField
            data_type: varchar
            description: "BBC's machine name for the statistic, e.g. `minsPlayed`, `totalPass`."
          - name: rowLabel
            data_type: varchar
            description: "The label BBC shows for the statistic, e.g. \"Minutes played\", or \"Chances created\" for `totalAssists`."
          - name: statValue
            data_type: varchar
            description: "{{ doc('stat_value') }}"

      - name: team_match_stats
        description: >
          The team statistics on a BBC match page, in long form: one row per
          team per match per statistic, keyed by `stat_path`. Staged by
          `stg_bbc_sport__team_match_stats`.
        columns:
          - name: source_match_id
            data_type: varchar
            description: "{{ doc('bbc_match_page_id') }}"
            data_tests:
              - relationships:
                  arguments:
                    to: source('bbc_sport', 'matches')
                    field: source_match_id
          - name: match_urn
            data_type: varchar
            description: "{{ doc('raw_match_urn') }}"
          - name: team_urn
            data_type: varchar
            description: "{{ doc('raw_team_urn') }}"
          - name: alignment
            data_type: varchar
            description: "{{ doc('alignment') }}"
          - name: stat_path
            data_type: varchar
            description: "BBC's name for the statistic, mostly `group.name`, e.g. `attack.shotsTotal`, `defence.wonTackle`; a few have no group, e.g. `possessionPercentage`."
          - name: stat_measure
            data_type: varchar
            description: "Always `total` in the data observed so far. Tested so that a new kind of measure, such as a per-half breakdown, is noticed rather than silently doubling the grain."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['total']
          - name: stat_value
            data_type: varchar
            description: "{{ doc('stat_value') }}"

      - name: fixtures
        description: >
          BBC's fixtures page: one row per match still to be played. A match
          leaves the page once played and appears in `matches` under the same
          ID. Staged by `stg_bbc_sport__fixtures`.
        columns:
          - name: month
            data_type: varchar
            description: The month heading the fixture is listed under, e.g. `2026-10`.
          - name: event_id
            data_type: varchar
            description: "{{ doc('bbc_match_id') }}"
            data_tests:
              - unique
              - not_null
          - name: date_heading
            data_type: varchar
            description: The day heading the fixture is listed under, without a year, e.g. "Sunday 18th October".
          - name: kickoff_time
            data_type: varchar
            description: Kickoff in UK local time, e.g. `14:00`, or `TBC` until BBC confirms it.
          - name: home_participant_id
            data_type: varchar
            description: "{{ doc('opta_team_id') }} The home team."
            data_tests:
              - not_null
          - name: away_participant_id
            data_type: varchar
            description: "{{ doc('opta_team_id') }} The away team."
            data_tests:
              - not_null
          - name: tournament_disambiguatedName
            data_type: varchar
            description: "{{ doc('tournament_name') }}"
          - name: tournament_urn
            data_type: varchar
            description: "BBC's tournament URN: `urn:bbc:sportsdata:football:tournament:womens-super-league`."
          - name: tournament_id
            data_type: varchar
            description: "{{ doc('opta_tournament_id') }}"
