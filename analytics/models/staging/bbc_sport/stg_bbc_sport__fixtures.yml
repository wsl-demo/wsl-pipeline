models:
  - name: stg_bbc_sport__fixtures
    description: >
      One row per scheduled match. A match leaves the fixtures page once played,
      and then appears in stg_bbc_sport__matches under the same match IDs.
    columns:
      - name: bbc_match_id
        description: >
          BBC's match ID: `s-` followed by Opta's match ID. The source sends it
          without the URN prefix that other BBC tables carry. The same ID the
          match carries in stg_bbc_sport__matches once played.
        data_tests:
          - unique
          - not_null
      - name: opta_match_id
        description: >
          Opta's match ID: bbc_match_id without its `s-` prefix. Null if
          bbc_match_id is not `s-` prefixed. Primary key.
        data_tests:
          - unique
          - not_null
      - name: opta_home_team_id
        description: Opta's ID of the home team, which BBC calls its participant ID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: opta_team_id
      - name: opta_away_team_id
        description: Opta's ID of the away team, which BBC calls its participant ID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: opta_team_id
      - name: match_date
        description: Calendar date of the match, in UK local time.
        data_tests:
          - not_null
      - name: is_kickoff_time_tbc
        description: True while BBC has not confirmed a kickoff time.
      - name: kicked_off_at
        description: Kickoff as a timestamp, assuming UK local time. Null while the time is TBC.
