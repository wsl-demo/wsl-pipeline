models:
  - name: stg_bbc_sport__match_player_cards
    description: Cards players were given during a match.
    columns:
      - name: bbc_match_id
        description: "BBC's match ID: the match URN without its prefix, `s-` followed by Opta's match ID."
        data_tests:
          - not_null
      - name: opta_match_id
        description: "Opta's match ID: bbc_match_id without its `s-` prefix. Null if bbc_match_id is not `s-` prefixed. Foreign key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: bbc_player_id
        description: "BBC's player ID: the player URN without its prefix, `s-` followed by Opta's player ID."
        data_tests:
          - not_null
      - name: opta_player_id
        description: "Opta's player ID: bbc_player_id without its `s-` prefix. Null if bbc_player_id is not `s-` prefixed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: bbc_team_id
        description: "BBC's team ID: the team URN without its prefix, a slug such as `arsenal-ladies`. Not an Opta ID."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      # The three card flags are CASE ... ELSE false, so they are non-nullable
      # by construction and a not_null test could never fail.
      - name: is_yellow_card
      - name: is_second_yellow
      - name: is_direct_red
      - name: regulation_time_minutes
      - name: injury_time_minutes
      - name: period
        description: >
          1 and 2 are the halves of normal time, 3 and 4 the halves of extra
          time.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
