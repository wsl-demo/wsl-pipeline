models:
  - name: stg_bbc_sport__match_player_cards
    description: |
      Every card shown in each played match: yellows, second yellows and
      straight reds (raw `bbc_sport.match_player_cards`).

      **Grain:** one row per card. **No staged column identifies a card:** the
      raw table is unique on match, player and `card_index`, which staging
      does not carry over. A player with two cards in a match (20 so far) has
      two rows that only their time tells apart.
    columns:
      - name: bbc_match_id
        description: "{{ doc('bbc_match_id') }}"
        data_tests:
          - not_null
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: bbc_player_id
        description: "{{ doc('bbc_player_id') }}"
        data_tests:
          - not_null
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: bbc_team_id
        description: "{{ doc('bbc_team_id') }} The carded player's team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      # The three card flags are CASE ... ELSE false, so they are non-nullable
      # by construction and a not_null test could never fail.
      - name: is_yellow_card
        description: "True for a booking that did not by itself send the player off."
      - name: is_second_yellow
        description: "True for a second booking, which sends the player off."
      - name: is_direct_red
        description: "True for a straight red card."
      - name: regulation_time_minutes
        description: "The regulation match minute the event happened in: the number before the `'` in raw `timeLabel_value`, so `90'+4` gives 90."
      - name: injury_time_minutes
        description: "Minutes into added time: the number after the `+` in raw `timeLabel_value`, so `90'+4` gives 4. Zero when there is no `+`."
      - name: period
        description: "Which part of the match the event belongs to, worked out from `regulation_time_minutes`: 1 for minutes 1–45, 2 for 46–90, 3 for 91–105 and 4 for 106–120 (3 and 4 are the halves of extra time). Added time belongs to the period it extends, so `45'+2` is period 1. Null past minute 120."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
