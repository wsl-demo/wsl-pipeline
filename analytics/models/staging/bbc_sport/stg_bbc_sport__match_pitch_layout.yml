models:
  - name: stg_bbc_sport__match_pitch_layout
    description: Player's position in the formation at the start of a match.
    data_tests:
      # A player is only in 1 position in the starting formation
      - unique:
          column_name: "bbc_match_id || '|' || bbc_player_id"
    columns:
      - name: bbc_match_id
        description: "BBC's match ID: the match URN without its prefix, `s-` followed by Opta's match ID."
        data_tests:
          - not_null
      - name: opta_match_id
        description: "Opta's match ID: bbc_match_id without its `s-` prefix. Null if bbc_match_id is not `s-` prefixed. Foreign key."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: source_side
        description: Which side of the fixture the slot belongs to.
        data_tests:
          - accepted_values:
              arguments:
                values: ['homeTeam', 'awayTeam']
      - name: bbc_team_id
        description: "BBC's ID of the team whose formation this slot belongs to: a slug such as `arsenal-ladies`. Not an Opta ID."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: bbc_player_id
        description: "BBC's player ID: the player URN without its prefix, `s-` followed by Opta's player ID."
        data_tests:
          - not_null
      - name: opta_player_id
        description: "Opta's player ID: bbc_player_id without its `s-` prefix. Null if bbc_player_id is not `s-` prefixed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: row_index
        data_tests:
          - not_null
      - name: slot_index
        data_tests:
          - not_null
