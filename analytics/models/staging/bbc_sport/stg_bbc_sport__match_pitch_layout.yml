models:
  - name: stg_bbc_sport__match_pitch_layout
    description: |
      Where each starter stood in their team's formation at kickoff, as BBC
      draws it on the pitch graphic (raw `bbc_sport.match_pitch_layout`). Only
      the starting eleven, so 22 rows per match.

      **Grain:** one row per starter per match (`bbc_match_id`,
      `bbc_player_id`, tested unique).
    data_tests:
      # A player is only in 1 position in the starting formation
      - unique:
          column_name: "bbc_match_id || '|' || bbc_player_id"
    columns:
      - name: bbc_match_id
        description: "{{ doc('bbc_match_id') }}"
        data_tests:
          - not_null
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: source_side
        description: "{{ doc('source_side') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['homeTeam', 'awayTeam']
      - name: bbc_team_id
        description: "{{ doc('bbc_team_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: bbc_player_id
        description: "{{ doc('bbc_player_id') }}"
        data_tests:
          - not_null
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: row_index
        description: "The line of the formation the player is in, from the back: 0 is always the goalkeeper, 1 the defenders and wing backs, and higher rows further forward."
        data_tests:
          - not_null
      - name: slot_index
        description: "The player's place within their line of the formation, from 0."
        data_tests:
          - not_null
