models:
  - name: stg_bbc_sport__match_officials
    description: Officials assigned to a match.
    data_tests:
      # An official is assigned to a match only 1 time
      - unique:
          column_name: "match_id || '|' || official_id"
    columns:
      - name: match_id
        description: ID of the match (BBC match URN without its prefix). Foreign key.
        data_tests:
          - not_null
      - name: official_id
        description: ID of the official (BBC official URN without its prefix).
        data_tests:
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
