models:
  - name: stg_bbc_sport__match_officials
    description: |
      The referee of each played match (raw `bbc_sport.match_officials`). BBC
      lists only the referee: every raw row has `type` = `Referee`, so there is
      one row per match.

      **Grain:** one row per official per match (`bbc_match_id`,
      `bbc_official_id`, tested unique).
    data_tests:
      # An official is assigned to a match only 1 time
      - unique:
          column_name: "bbc_match_id || '|' || bbc_official_id"
    columns:
      - name: bbc_match_id
        description: "{{ doc('bbc_match_id') }}"
        data_tests:
          - not_null
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: bbc_official_id
        description: "BBC's official ID. Unlike BBC's player and match IDs it has no `s-`; it looks like an Opta ID but is unconfirmed."
        data_tests:
          - not_null
      - name: bbc_official_op_id
        description: "A short numeric ID BBC sends for 4 of the 45 referees, null for the rest; what issues it is unconfirmed."
      - name: first_name
        description: "The match official's first name."
        data_tests:
          - not_null
      - name: last_name
        description: "The match official's last name."
        data_tests:
          - not_null
