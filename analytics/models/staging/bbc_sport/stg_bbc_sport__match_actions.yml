models:
  - name: stg_bbc_sport__match_actions
    description: Actions players performed during a match.
    columns:
      - name: match_id
        description: ID of the match (BBC match URN without its prefix). Foreign key.
        data_tests:
          - not_null
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: team_id
      - name: player_id
        data_tests:
          - not_null
      - name: opta_player_id
        description: "Opta's player ID, which is player_id without its `s-` prefix. Null if the ID is not `s-` prefixed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: action_index
      - name: sub_index
      - name: is_own_goal
      - name: is_goal
      - name: is_direct_red
      - name: is_second_yellow
      - name: is_penalty
      - name: regulation_time_minutes
      - name: injury_time_minutes
      - name: period
        description: >
          1 and 2 are the halves of normal time, 3 and 4 the halves of extra
          time.
        data_tests:
          # `period` is an integer, so the values must not be quoted. Without
          # quote: false the test compiles to `not in ('1','2','3','4')` and
          # fails strict static analysis.
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
