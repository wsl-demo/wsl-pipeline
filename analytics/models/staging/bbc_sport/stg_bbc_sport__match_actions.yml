models:
  - name: stg_bbc_sport__match_actions
    description: |
      The goals and sendings-off in each played match, as listed under each
      team on BBC's match page (raw `bbc_sport.match_actions`).

      **Grain:** one row per action (`bbc_match_id`, `bbc_team_id`,
      `action_index`, `sub_index`, tested unique). BBC numbers the players who
      acted for each side (`action_index`) and each of a player's actions
      (`sub_index`).
    data_tests:
      - unique:
          column_name: "bbc_match_id || '|' || bbc_team_id || '|' || action_index || '|' || sub_index"
    columns:
      - name: bbc_match_id
        description: "{{ doc('bbc_match_id') }}"
        data_tests:
          - not_null
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: bbc_team_id
        description: "{{ doc('bbc_team_id') }} For an own goal, the team the goal counts for, not the scorer's team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: bbc_player_id
        description: "{{ doc('bbc_player_id') }}"
        data_tests:
          - not_null
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: action_index
        description: "Position of the acting player in their side's list of actions, from 0."
      - name: sub_index
        description: "Position of the action among that player's actions, from 0."
      # The five action flags are CASE ... ELSE false, so they are
      # non-nullable by construction and a not_null test could never fail.
      - name: is_own_goal
        description: "True for an own goal."
      - name: is_goal
        description: "True for a goal other than a penalty or an own goal, which have their own flags."
      - name: is_direct_red
        description: "True for a straight red card."
      - name: is_second_yellow
        description: "True for a second booking, which sends the player off."
      - name: is_penalty
        description: "True for a scored penalty."
      - name: regulation_time_minutes
        description: "The regulation match minute the event happened in: the number before the `'` in raw `timeLabel_value`, so `90'+4` gives 90."
      - name: injury_time_minutes
        description: "Minutes into added time: the number after the `+` in raw `timeLabel_value`, so `90'+4` gives 4. Zero when there is no `+`."
      - name: period
        description: "Which part of the match the event belongs to, worked out from `regulation_time_minutes`: 1 for minutes 1–45, 2 for 46–90, 3 for 91–105 and 4 for 106–120 (3 and 4 are the halves of extra time). Added time belongs to the period it extends, so `45'+2` is period 1. Null past minute 120."
        data_tests:
          # `period` is an integer, so the values must not be quoted. Without
          # quote: false the test compiles to `not in ('1','2','3','4')` and
          # fails strict static analysis.
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
