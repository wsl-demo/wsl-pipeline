models:
  - name: stg_bbc_sport__player_match_stats
    description: |
      Each player's statistics for each match, in the source's long shape:
      one row per statistic (raw `bbc_sport.player_match_stats`).
      `int_player_match_stats_pivoted` reshapes it to one row per appearance.

      **Grain:** one row per player per match per statistic (`bbc_match_id`,
      `bbc_player_id`, `stat_name`, tested unique).

      **What staging changes:** URN prefixes removed; Opta IDs derived from
      BBC's; `stat_value` and `stat_index` cast from text; columns renamed.

      **Not carried over:** `source_match_id` (BBC's page slug, on
      `stg_bbc_sport__matches`).

      **Which statistics a player has varies.** Every squad member has some
      rows, but a statistic is missing rather than zero when BBC doesn't
      show it: `minsPlayed` is missing for unused substitutes, `shotsSaved`
      exists only for the starting goalkeepers, and `penaltySave` and `penaltyMiss` only
      when they happened.
    data_tests:
      - unique:
          column_name: "bbc_match_id || '|' || bbc_player_id || '|' || stat_name"
    columns:
      - name: bbc_match_id
        description: "{{ doc('bbc_match_id') }}"
        data_tests:
          - not_null
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: bbc_team_id
        description: "{{ doc('bbc_team_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_teams')
                field: bbc_team_id
      - name: bbc_player_id
        description: "{{ doc('bbc_player_id') }}"
        data_tests:
          - not_null
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__match_players')
                field: opta_player_id
      - name: stat_index
        description: "Where the statistic comes in the list BBC shows for the player, from 0. Varies by player, because each list holds only the statistics that player has."
      - name: stat_name
        description: "BBC's machine name for the statistic, e.g. `minsPlayed`, `totalPass`."
        data_tests:
          - not_null
          # Guards the pivot in int_player_match_stats_pivoted: a new or
          # renamed statistic fails here rather than silently going missing.
          - accepted_values:
              arguments:
                values:
                  - minsPlayed
                  - goals
                  - assists
                  - totalAssists
                  - shotsTotal
                  - shotsOnTarget
                  - shotsSaved
                  - totalPass
                  - accuratePassPercentage
                  - totalTackle
                  - wonTacklePercentage
                  - fouls
                  - wasFouled
                  - penaltySave
                  - penaltyMiss
      - name: stat_label
        description: "The label BBC shows for the statistic, e.g. \"Minutes played\", or \"Chances created\" for `totalAssists`."
      - name: stat_value
        description: "{{ doc('stat_value') }}"
        data_tests:
          - not_null
