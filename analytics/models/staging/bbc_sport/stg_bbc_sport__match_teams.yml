models:
  - name: stg_bbc_sport__match_teams
    description: One row per team per match, with the team's formation and manager.
    data_tests:
      # A team appears once per side of a fixture
      - unique:
          column_name: "match_id || '|' || source_side"
    columns:
      - name: match_id
        description: ID of the match (BBC match URN without its prefix). Foreign key.
        data_tests:
          - not_null
      - name: source_side
        data_tests:
          - accepted_values:
              arguments:
                values: ['homeTeam', 'awayTeam']
      - name: team_id
        description: ID of the team (BBC team URN without its prefix). Foreign key.
        data_tests:
          - not_null
      - name: opta_team_id
        description: >
          Opta's team ID, which BBC calls its participant ID. Stable per team
          across matches, and the key teams carry in the marts.
        data_tests:
          - not_null
      - name: team_name
        description: Full team name, e.g. "Arsenal Women".
        data_tests:
          - not_null
      - name: team_short_name
      - name: team_code
        description: Three-letter abbreviation.
      - name: alignment
      - name: formation
        description: Formation as written by the source, e.g. "4-2-3-1".
      - name: manager_name
