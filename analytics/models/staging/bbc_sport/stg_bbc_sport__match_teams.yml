models:
  - name: stg_bbc_sport__match_teams
    description: |
      The two teams in each played match, with their names, formation and
      manager (raw `bbc_sport.match_teams`). The one table that carries both of
      a team's IDs, so it is how other BBC tables, which only have the BBC slug,
      get to Opta's team ID.

      **Grain:** one row per team per match (`bbc_match_id`, `source_side`,
      tested unique).

      **What staging changes:** URN prefixes removed; Opta's match ID derived
      from BBC's; columns renamed. Nothing is cast or recoded.

      **Not carried over:** `source_match_id` (BBC's page slug, on
      `stg_bbc_sport__matches`), `formation_layout` and `formation_accessible`
      (the formation written as `433` and for screen readers), and
      `hasPlayerStats` (true for every team).
    data_tests:
      # A team appears once per side of a fixture
      - unique:
          column_name: "bbc_match_id || '|' || source_side"
    columns:
      - name: bbc_match_id
        description: "{{ doc('bbc_match_id') }}"
        data_tests:
          - not_null
      - name: opta_match_id
        description: "{{ doc('opta_match_id') }} {{ doc('opta_id_from_bbc_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: opta_match_id
      - name: source_side
        description: "{{ doc('source_side') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['homeTeam', 'awayTeam']
      - name: bbc_team_id
        description: "{{ doc('bbc_team_id') }}"
        data_tests:
          - not_null
      - name: opta_team_id
        description: "{{ doc('opta_team_id') }}"
        data_tests:
          - not_null
      - name: team_name
        description: "{{ doc('team_name') }}"
        data_tests:
          - not_null
      - name: team_short_name
        description: "{{ doc('team_short_name') }}"
      - name: team_code
        description: "{{ doc('team_code') }}"
      - name: alignment
        description: "{{ doc('alignment') }}"
      - name: formation
        description: "Starting formation as BBC writes it, with spaces around the dashes, e.g. \"4 - 2 - 3 - 1\"."
      - name: bbc_manager_id
        description: "BBC's ID for the team's manager in the match, e.g. `btg39qwx8587tn3oieu0ajpbd`. Stable per manager; it looks like an Opta ID but is unconfirmed."
      - name: manager_name
        description: "The team manager's full name."
