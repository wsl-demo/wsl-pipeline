models:
  - name: stg_wsl_football__squad_players
    description: |
      Biography of every player in a club's current squad, from the league's
      own site (raw `wsl_football.squad_players`).

      **A snapshot.** The source lists current squads only, as of the last
      fetch. A player who leaves a squad disappears from it, so the marts have
      no biography for players who have left.

      **Grain:** one row per player (`opta_player_id`, tested unique).

      **What staging changes:** columns renamed; empty strings nulled;
      `dateOfBirth`, written two ways (`2006-02-03` and
      `2006-02-03T00:00:00Z`), cut to its date and cast; height and weight cast
      to integers.

      **Not carried over:** the player's club, shirt number, and the club logos
      and links repeated on every row. Which team a player belongs to comes from
      BBC Sport, so none of it is used.
    columns:
      - name: opta_player_id
        description: "{{ doc('opta_player_id') }} From raw `optaId`, as sent. Primary key."
        data_tests:
          - not_null
          - unique
      - name: first_name
        description: The player's first name. From raw `mediaFirstName`, as sent.
        data_tests:
          - not_null
      - name: last_name
        description: The player's last name. From raw `mediaLastName`, as sent.
        data_tests:
          - not_null
      - name: short_name
        description: >
          Initial and surname, e.g. "A. Russo". From raw `shortName`, as sent.
          Identical to BBC Sport's display_name for every player both sources
          know.
        data_tests:
          - not_null
      - name: shirt_name
        description: The name the player is known by, e.g. "Mapi León". From raw `shirtName`; empty becomes null. Recorded for only a few players.
      - name: nationality
        description: "{{ doc('nationality') }} From raw `nationality`, as sent."
      - name: nationality_iso_code
        description: "{{ doc('nationality_iso_code') }} From raw `nationalityIsoCode`, as sent."
      - name: birth_date
        description: "{{ doc('birth_date') }} From the first ten characters of raw `dateOfBirth`, cast to date."
        data_tests:
          - expression_is_true:
              arguments:
                expression: "birth_date is null or birth_date between date '1970-01-01' and date '2012-12-31'"
      - name: height_cm
        description: "{{ doc('height_cm') }} From raw `height`, cast to integer."
      - name: weight_kg
        description: "{{ doc('weight_kg') }} From raw `weight`, cast to integer."
