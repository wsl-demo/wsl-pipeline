models:
  - name: stg_wsl_football__squad_players
    description: >
      One row per player in a current squad, with biographical data only.
    columns:
      - name: opta_player_id
        description: >
          Opta's player ID. BBC Sport's player_id is this with an `s-` prefix.
          Primary key.
        data_tests:
          - not_null
          - unique
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: short_name
        description: >
          Initial and surname, e.g. "A. Russo". Identical to BBC Sport's
          display_name for every player both sources know.
        data_tests:
          - not_null
      - name: shirt_name
        description: Name printed on the shirt. Recorded for only a few players.
      - name: nationality
      - name: nationality_iso_code
        description: Three-letter country code, e.g. ENG. Not strictly ISO 3166.
      - name: birth_date
        description: Null for the few players the source has no birth date for.
        data_tests:
          - expression_is_true:
              arguments:
                expression: "birth_date is null or birth_date between date '1970-01-01' and date '2012-12-31'"
      - name: height_cm
        description: Centimetres (assumed; the source gives no unit). Sparsely recorded.
      - name: weight_kg
        description: Kilograms (assumed; the source gives no unit). Sparsely recorded.
