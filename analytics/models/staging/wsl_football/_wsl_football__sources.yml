version: 2

sources:
  - name: wsl_football
    description: >
      The league's official site. Used only for player biographical data;
      which team a player belongs to comes from BBC Sport.
    schema: raw
    loader: just setup
    tables:
      - name: squad_players
        description: >
          One row per player in a club's current squad, as of the last fetch.
          A snapshot: a player who leaves a squad disappears from it.
        config:
          loaded_at_field: "cast(source_fetched_at as timestamptz)"
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 14, period: day}
        columns:
          - name: optaId
            description: >
              Opta's player ID. BBC Sport uses the same ID with an `s-` prefix.
              Primary key.
            data_tests:
              - unique
              - not_null
          - name: nationality
            data_tests:
              - not_null
          - name: nationalityIsoCode
            description: Three-letter country code, e.g. ENG, DEU. Not strictly ISO.
            data_tests:
              - not_null
          - name: dateOfBirth
            description: >
              ISO date, written either as `2006-02-03` or `2006-02-03T00:00:00Z`
              depending on the player. Missing for a few players.
