version: 2

# Declares only the raw columns the project uses, each as varchar; see the
# comment at the top of _bbc_sport__sources.yml for why.

sources:
  - name: wsl_football
    description: >
      The league's official site. Used only for player biographical data;
      which team a player belongs to comes from BBC Sport.
    schema: raw
    loader: just setup
    tables:
      - name: squad_players
        description: >
          One row per player in a club's current squad, as of the last fetch.
          A snapshot: a player who leaves a squad disappears from it. Staged by
          `stg_wsl_football__squad_players`.
        config:
          loaded_at_field: "cast(source_fetched_at as timestamptz)"
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 14, period: day}
        columns:
          - name: optaId
            data_type: varchar
            description: "{{ doc('opta_player_id') }}"
            data_tests:
              - unique
              - not_null
          - name: mediaFirstName
            data_type: varchar
            description: "{{ doc('name_first') }}"
          - name: mediaLastName
            data_type: varchar
            description: "{{ doc('name_last') }}"
          - name: shortName
            data_type: varchar
            description: "{{ doc('display_name') }}"
          - name: nationality
            data_type: varchar
            description: "{{ doc('nationality') }}"
            data_tests:
              - not_null
          - name: nationalityIsoCode
            data_type: varchar
            description: "{{ doc('nationality_iso_code') }}"
            data_tests:
              - not_null
          - name: dateOfBirth
            data_type: varchar
            description: >
              ISO date, written either as `2006-02-03` or `2006-02-03T00:00:00Z`
              depending on the player. Missing for a few players.
          - name: height
            data_type: varchar
            description: "{{ doc('height_cm') }}"
          - name: weight
            data_type: varchar
            description: "{{ doc('weight_kg') }}"
          - name: shirtName
            data_type: varchar
            description: "{{ doc('name_shirt') }}"
          - name: source_fetched_at
            data_type: varchar
            description: "When the page was fetched, as an ISO timestamp. The source's `loaded_at_field`."
