models:
  - name: fct_player_appearances
    description: >
      One row per player per match. Holds the measures that dim_players used to
      store as six pivoted starts_as_* columns; counting starts by position is
      now an aggregation over this model.
    data_tests:
      - unique:
          column_name: "match_id || '|' || player_id"
    columns:
      - name: match_id
        description: BBC's short match ID. Foreign key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bbc_sport__matches')
                field: match_id
      - name: player_id
        description: ID of the player (BBC player URN without its prefix). Foreign key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: team_id
        description: Team the player appeared for in this match.
        data_tests:
          - not_null
      - name: is_starter
      - name: position
        description: Playing position. Null when the appearance was from the bench.
      - name: shirt_number
      - name: is_captain
      - name: substituted_on_minute
        description: Minute the player came on. Null for starters and unused subs.
      - name: substituted_on_reason
      - name: substituted_off_minute
        description: >
          Minute the player was replaced. Null for players who finished the
          match and for those who never came on.
      - name: substituted_off_reason
      - name: minutes_played
        description: >
          From the source's minsPlayed statistic. Null where the source did not
          record it, which is expected rather than a defect.
      - name: goals
      - name: assists
      - name: chances_created
      - name: shots_total
      - name: shots_on_target
      - name: saves
        description: Recorded for goalkeepers only.
      - name: total_passes
      - name: pass_accuracy_pct
      - name: total_tackles
      - name: tackles_won_pct
      - name: fouls_committed
      - name: fouls_won
