unit_tests:
  - name: fixtures_state_result_and_points
    description: >
      The state follows BBC's latest listed status, and a later listing that
      left the match out makes it `no_longer_listed` whatever its status was.
      Result columns are filled only once finished, so an in-play match has no
      winner, score or points even though BBC sends a running score and a
      leader. An awarded match is finished with its points from the winner.
      Season follows the UK date with a 1 July boundary, and seasons before
      `first_season` are left out. Venue and managers come from the match's
      page, the matchday from the derived one, and `kickoff_changed_at` is the
      latest observed change.
    model: fixtures
    given:
      - input: ref('int_matches_listing_state_derived')
        rows:
          - {opta_match_id: "m1", bbc_status: "PostEvent", bbc_status_note: "FT", match_date: "2026-05-16", opta_home_team_id: "a", opta_away_team_id: "b", home_score_fulltime: 2, away_score_fulltime: 1, winner_side: "home"}
          # 1 July starts the next season
          - {opta_match_id: "m2", bbc_status: "PostEvent", bbc_status_note: "FT", match_date: "2026-07-01", opta_home_team_id: "a", opta_away_team_id: "b", home_score_fulltime: 1, away_score_fulltime: 1, winner_side: "draw"}
          - {opta_match_id: "m3", bbc_status: "MidEvent", bbc_status_note: "72'", match_date: "2026-10-18", opta_home_team_id: "a", opta_away_team_id: "b", home_score_fulltime: 0, away_score_fulltime: 1, winner_side: "away"}
          - {opta_match_id: "f1", bbc_status: "PreEvent", bbc_status_note: "Scheduled", match_date: "2027-05-22", is_kickoff_time_tbc: true, opta_home_team_id: "a", opta_away_team_id: "b"}
          - {opta_match_id: "w1", bbc_status: "PostEvent", bbc_status_note: "Match awarded to Tottenham Hotspur", match_date: "2026-11-08", opta_home_team_id: "a", opta_away_team_id: "b", home_score_fulltime: 0, away_score_fulltime: 0, winner_side: "home"}
          - {opta_match_id: "u1", bbc_status: "PreEvent", bbc_status_note: "Scheduled", match_date: "2026-10-24", opta_home_team_id: "a", opta_away_team_id: "b", no_longer_listed_at: "2026-10-25 09:00:00+00:00"}
          - {opta_match_id: "old", bbc_status: "PostEvent", bbc_status_note: "FT", match_date: "2022-01-15", opta_home_team_id: "a", opta_away_team_id: "b", home_score_fulltime: 1, away_score_fulltime: 0, winner_side: "home"}
      - input: ref('stg_bbc_sport__matches')
        rows:
          - {opta_match_id: "m1", venue_name: "Emirates Stadium"}
      - input: ref('int_matches_kickoff_changes_derived')
        rows:
          - {opta_match_id: "f1", changed_at: "2026-10-16 08:00:00+00:00"}
          - {opta_match_id: "f1", changed_at: "2026-10-17 08:00:00+00:00"}
      - input: ref('int_fixtures_matchday_derived')
        rows:
          - {opta_match_id: "m1", matchday: 3}
      - input: ref('stg_bbc_sport__match_teams')
        rows:
          - {opta_match_id: "m1", source_side: "homeTeam", bbc_manager_id: "h1", manager_name: "Home Boss"}
          - {opta_match_id: "m1", source_side: "awayTeam", bbc_manager_id: "a1", manager_name: "Away Boss"}
    expect:
      rows:
        - {opta_match_id: "m1", state: "finished", has_result: true, is_awarded: false, season: "2025-2026", matchday: 3, winner_side: "home", home_score_fulltime: 2, home_points: 3, away_points: 0, venue_name: "Emirates Stadium", bbc_home_manager_id: "h1", bbc_away_manager_id: "a1", kickoff_changed_at: null}
        - {opta_match_id: "m2", state: "finished", has_result: true, is_awarded: false, season: "2026-2027", matchday: null, winner_side: "draw", home_score_fulltime: 1, home_points: 1, away_points: 1, venue_name: null, bbc_home_manager_id: null, bbc_away_manager_id: null, kickoff_changed_at: null}
        - {opta_match_id: "m3", state: "in_play", has_result: false, is_awarded: false, season: "2026-2027", matchday: null, winner_side: null, home_score_fulltime: null, home_points: null, away_points: null, venue_name: null, bbc_home_manager_id: null, bbc_away_manager_id: null, kickoff_changed_at: null}
        - {opta_match_id: "f1", state: "scheduled", has_result: false, is_awarded: false, season: "2026-2027", matchday: null, winner_side: null, home_score_fulltime: null, home_points: null, away_points: null, venue_name: null, bbc_home_manager_id: null, bbc_away_manager_id: null, kickoff_changed_at: "2026-10-17 08:00:00+00:00"}
        - {opta_match_id: "w1", state: "finished", has_result: true, is_awarded: true, season: "2026-2027", matchday: null, winner_side: "home", home_score_fulltime: 0, home_points: 3, away_points: 0, venue_name: null, bbc_home_manager_id: null, bbc_away_manager_id: null, kickoff_changed_at: null}
        - {opta_match_id: "u1", state: "no_longer_listed", has_result: false, is_awarded: false, season: "2026-2027", matchday: null, winner_side: null, home_score_fulltime: null, home_points: null, away_points: null, venue_name: null, bbc_home_manager_id: null, bbc_away_manager_id: null, kickoff_changed_at: null}
