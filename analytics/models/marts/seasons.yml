models:
  - name: seasons
    description: >
      One row per season in the data, from the earliest fixture to the latest. A season runs from 1 July to 30 June.
    config:
      contract:
        enforced: true
    columns:
      - name: season
        data_type: varchar
        description: "{{ doc('season') }}"
        data_tests:
          - unique
          - not_null
      - name: team_count
        data_type: integer
        description: Number of distinct teams that have a match in the season.
      - name: matches_total
        data_type: integer
        description: Fixtures listed, with or without a result.
      - name: matches_played
        data_type: integer
        description: Matches with a result.
      - name: is_current
        data_type: boolean
        description: True for the latest season present in the data. Exactly one season is current.
        data_tests:
          - not_null
      - name: first_match_date
        data_type: date
        description: Date of the season's first match.
      - name: last_match_date
        data_type: date
        description: Date of the season's last match, with or without a result. For the current season, usually a fixture still to come.
