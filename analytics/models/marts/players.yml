models:
  - name: players
    description: >
      One row per player known to either source: names and biography only.
      Which team a player was in, and when, is `squad_members`. Players in a
      current squad who have not yet been named in a match are included.
      Names are BBC's, from the player's latest matchday squad, or
      wsl_football's for a player not yet named in one.
    config:
      contract:
        enforced: true
    columns:
      - name: opta_player_id
        data_type: varchar
        description: "{{ doc('opta_player_id') }}"
        data_tests:
          - not_null
          - unique
      - name: name_first
        data_type: varchar
        description: "{{ doc('name_first') }}"
      - name: name_last
        data_type: varchar
        description: "{{ doc('name_last') }}"
      - name: name_shirt
        data_type: varchar
        description: "{{ doc('name_shirt') }}"
      - name: display_name
        data_type: varchar
        description: "{{ doc('display_name') }}"
        data_tests:
          - not_null
      - name: nationality
        data_type: varchar
        description: "{{ doc('nationality') }}"
      - name: nationality_iso_code
        data_type: varchar
        description: "{{ doc('nationality_iso_code') }}"
      - name: height_cm
        data_type: integer
        description: "{{ doc('height_cm') }}"
      - name: weight_kg
        data_type: integer
        description: "{{ doc('weight_kg') }}"
      - name: birth_date
        data_type: date
        description: "{{ doc('birth_date') }}"
