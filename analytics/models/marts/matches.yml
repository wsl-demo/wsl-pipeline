models:
  - name: matches
    description: >
      One row per match, played or scheduled. A match keeps its opta_match_id from
      fixture to result, so status changes while identity does not. Result
      columns are null until the match is played.
    config:
      contract:
        enforced: true
    columns:
      - name: opta_match_id
        data_type: varchar
        description: "{{ doc('opta_match_id') }} Primary key."
        data_tests:
          - unique
          - not_null
      - name: opta_home_team_id
        data_type: varchar
        description: "{{ doc('opta_team_id') }} The home team. Foreign key to teams."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: opta_team_id
      - name: opta_away_team_id
        data_type: varchar
        description: "{{ doc('opta_team_id') }} The away team. Foreign key to teams."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: opta_team_id
      - name: match_status
        data_type: varchar
        description: "'scheduled' until a result exists, then 'played'."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['scheduled', 'played']
      - name: season
        data_type: varchar
        description: "{{ doc('season') }} Foreign key to seasons."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seasons')
                field: season
      - name: winner_side
        data_type: varchar
        description: "'home', 'away' or 'draw'. Null until the match is played."
      - name: tournament_name
        data_type: varchar
        description: Null for a scheduled match; the fixtures page does not carry it.
      - name: venue_name
        data_type: varchar
        description: Null for a scheduled match; the fixtures page does not carry it.
      - name: home_score_fulltime
        data_type: integer
        description: Null until the match is played.
      - name: away_score_fulltime
        data_type: integer
        description: Null until the match is played.
      - name: home_points
        data_type: integer
        description: League points the home side earned (3 win, 1 draw, 0 loss). Null until played.
      - name: away_points
        data_type: integer
        description: League points the away side earned (3 win, 1 draw, 0 loss). Null until played.
      - name: match_date
        data_type: date
        description: Calendar date of the match in UK local time.
        data_tests:
          - not_null
      - name: kicked_off_at
        data_type: timestamp with time zone
        description: Kickoff. Null for a scheduled match whose time is still TBC.
