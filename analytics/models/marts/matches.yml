models:
  - name: matches
    description: >
      One row per match, played or scheduled. A match keeps its opta_match_id from
      fixture to result, so status changes while identity does not. Result
      columns are null until the match is played.
    config:
      contract:
        enforced: true
    columns:
      - name: opta_match_id
        data_type: varchar
        description: "{{ doc('opta_match_id') }}"
        data_tests:
          - unique
          - not_null
      - name: opta_home_team_id
        data_type: varchar
        description: "{{ doc('opta_team_id') }} The home team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: opta_team_id
      - name: opta_away_team_id
        data_type: varchar
        description: "{{ doc('opta_team_id') }} The away team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: opta_team_id
      - name: match_status
        data_type: varchar
        description: "`scheduled` until a result exists, then `played`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['scheduled', 'played']
      - name: season
        data_type: varchar
        description: "{{ doc('season') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seasons')
                field: season
      - name: winner_side
        data_type: varchar
        description: "{{ doc('winner_side') }}"
      - name: tournament_name
        data_type: varchar
        description: "{{ doc('tournament_name') }}"
      - name: venue_name
        data_type: varchar
        description: "{{ doc('venue_name') }}"
      - name: home_score_fulltime
        data_type: integer
        description: "{{ doc('score_fulltime') }} The home team."
      - name: away_score_fulltime
        data_type: integer
        description: "{{ doc('score_fulltime') }} The away team."
      - name: home_points
        data_type: integer
        description: "{{ doc('points') }} The home team."
      - name: away_points
        data_type: integer
        description: "{{ doc('points') }} The away team."
      - name: match_date
        data_type: date
        description: "{{ doc('match_date') }}"
        data_tests:
          - not_null
      - name: kicked_off_at
        data_type: timestamp with time zone
        description: "{{ doc('kicked_off_at') }}"
