models:
  - name: squad_members
    description: >
      One row per player per team per season, with biography joined in. Squads
      are inferred: a player is a member when named in one of the team's
      matchday squads that season, so a player who never made a matchday squad
      is not here, and a player who moved mid-season appears for each team.
      Biography comes from current squad lists, so it is null for players who
      have since left.
    config:
      contract:
        enforced: true
    data_tests:
      - unique:
          column_name: "season || '|' || opta_team_id || '|' || opta_player_id"
    columns:
      - name: opta_player_id
        data_type: varchar
        description: "{{ doc('opta_player_id') }} Foreign key to players."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('players')
                field: opta_player_id
      - name: opta_team_id
        data_type: varchar
        description: "{{ doc('opta_team_id') }} Foreign key to teams."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: opta_team_id
      - name: season
        data_type: varchar
        description: "{{ doc('season') }} Foreign key to seasons."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seasons')
                field: season
      - name: name_first
        data_type: varchar
        description: As BBC gave it at the player's latest selection for this team this season.
      - name: name_last
        data_type: varchar
        description: As BBC gave it at the player's latest selection for this team this season.
      - name: display_name
        data_type: varchar
        description: As BBC gave it at the player's latest selection for this team this season, e.g. "F. Kirby".
      - name: most_common_start_position
        data_type: varchar
        description: >
          Position the player started in most often for this team this season,
          ties broken by the most recent start. Null if they never started.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Goalkeeper
                  - Defender
                  - Defensive Midfielder
                  - Wing Back
                  - Midfielder
                  - Attacking Midfielder
                  - Striker
      - name: nationality
        data_type: varchar
        description: "{{ doc('nationality') }} Null for players no longer in a current squad, since wsl_football lists current squads only."
      - name: nationality_iso_code
        data_type: varchar
        description: "{{ doc('nationality_iso_code') }} Null for players no longer in a current squad, since wsl_football lists current squads only."
      - name: shirt_number
        data_type: integer
        description: Shirt worn at the player's latest squad selection for this team this season.
      - name: matches_in_squad
        data_type: integer
        description: Matchday squads the player was named in, bench included.
        data_tests:
          - not_null
      - name: matches_appeared
        data_type: integer
        description: Matches the player started or came on in.
      - name: matches_started
        data_type: integer
        description: Matches the player started.
      - name: height_cm
        data_type: integer
        description: "{{ doc('height_cm') }} Null for players no longer in a current squad, since wsl_football lists current squads only."
      - name: weight_kg
        data_type: integer
        description: "{{ doc('weight_kg') }} Null for players no longer in a current squad, since wsl_football lists current squads only."
      - name: birth_date
        data_type: date
        description: "{{ doc('birth_date') }} Null for players no longer in a current squad, since wsl_football lists current squads only."
      - name: first_squad_date
        data_type: date
        description: Date of the player's first squad selection for this team this season.
      - name: last_squad_date
        data_type: date
        description: Date of the player's latest squad selection for this team this season.
