models:
  - name: teams
    description: >
      One row per team, holding attributes only, taken from the team's most
      recent match. Includes clubs no longer in the league; which teams played in
      a season is in `matches` and `squad_members`.
    config:
      contract:
        enforced: true
    columns:
      - name: opta_team_id
        data_type: varchar
        description: "{{ doc('opta_team_id') }}"
        data_tests:
          - not_null
          - unique
      - name: team_code
        data_type: varchar
        description: "{{ doc('team_code') }}"
        data_tests:
          - not_null
          - unique
      - name: team_name
        data_type: varchar
        description: "{{ doc('team_name') }}"
        data_tests:
          - not_null
      - name: team_short_name
        data_type: varchar
        description: "{{ doc('team_short_name') }}"
