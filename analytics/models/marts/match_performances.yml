models:
  - name: match_performances
    description: >
      One row per player per match they were named in the squad for, bench
      included; count appearances with has_appeared. The entered_ and left_
      columns bound the player's time on the pitch; left_ is null if they were
      on at the final whistle. Times are to the minute, so an action in a
      substitution's minute falls in both players' windows.
    config:
      contract:
        enforced: true
    data_tests:
      - unique:
          column_name: "opta_match_id || '|' || opta_player_id"
      # Every starter is placed and nobody else is, so no start is dropped
      # from the pitch layout.
      - expression_is_true:
          arguments:
            expression: "(start_depth IS NOT NULL) = is_starter AND (start_width IS NOT NULL) = is_starter"
    columns:
      - name: opta_match_id
        data_type: varchar
        description: "{{ doc('opta_match_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fixtures')
                field: opta_match_id
      - name: opta_player_id
        data_type: varchar
        description: "{{ doc('opta_player_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('players')
                field: opta_player_id
      - name: opta_team_id
        data_type: varchar
        description: "{{ doc('opta_team_id') }} The team the player was named for in the match."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: opta_team_id
      - name: match_date
        data_type: date
        description: "{{ doc('match_date') }}"
        data_tests:
          - not_null
      - name: season
        data_type: varchar
        description: "{{ doc('season') }}"
        data_tests:
          - not_null
      - name: position
        data_type: varchar
        description: "{{ doc('position') }}"
      - name: substituted_on_reason
        data_type: varchar
        description: "{{ doc('substituted_on_reason') }}"
      - name: substituted_off_reason
        data_type: varchar
        description: "{{ doc('substituted_off_reason') }}"
      - name: shirt_number
        data_type: integer
        description: "{{ doc('shirt_number') }}"
      - name: entered_regulation_minute
        data_type: integer
        description: "{{ doc('regulation_minute') }} When the player came on; 0 for a starter."
      - name: entered_injury_minute
        data_type: integer
        description: "{{ doc('injury_minute') }} When the player came on."
      - name: entered_match_minute
        data_type: decimal(4,2)
        description: "{{ doc('match_minute') }} When the player came on; 0.00 for a starter."
      - name: left_regulation_minute
        data_type: integer
        description: "{{ doc('regulation_minute') }} When the player was substituted off or sent off."
      - name: left_injury_minute
        data_type: integer
        description: "{{ doc('injury_minute') }} When the player was substituted off or sent off."
      - name: left_match_minute
        data_type: decimal(4,2)
        description: "{{ doc('match_minute') }} When the player was substituted off or sent off."
      - name: start_depth
        data_type: decimal(4,3)
        description: Where the formation put a starter at kickoff, from the goalkeeper (0) to the front line (1). Lines are evenly spaced, so a back line is at 0.333 in a 4-4-2 and 0.25 in a 4-2-3-1. Null for the bench.
      - name: start_width
        data_type: decimal(4,3)
        description: Where the formation put a starter at kickoff across their line, from near 1 (the right) to near 0 (the left), at the middle of the slot's equal share of the line. Left and right are inferred from Opta's numbering; see int_players_start_location_derived. Null for the bench.
      - name: minutes_played
        data_type: integer
        description: "Minutes the player was on the pitch, from BBC's `minsPlayed`. Never more than 90, so added time is not counted. Null for an unused substitute."
      - name: goals
        data_type: integer
        description: "Goals the player scored, from BBC's `goals`. Penalties count and own goals do not. Null for a starting goalkeeper."
      - name: assists
        data_type: integer
        description: "Assists, from BBC's `assists`. Null for a starting goalkeeper."
      - name: chances_created
        data_type: integer
        description: "From BBC's `totalAssists`, which BBC labels \"Chances created\"; the column follows the label. Never lower than `assists`, so assists count as chances created. Null for a starting goalkeeper."
      - name: shots_total
        data_type: integer
        description: "Shots, on and off target, from BBC's `shotsTotal`. Null for a starting goalkeeper."
      - name: shots_on_target
        data_type: integer
        description: "Shots on target, from BBC's `shotsOnTarget`. Never more than `shots_total`. Null for a starting goalkeeper."
      - name: saves
        data_type: integer
        description: "Shots saved, from BBC's `shotsSaved`. Recorded only for starting goalkeepers; null for everyone else."
      - name: total_passes
        data_type: integer
        description: "Passes, from BBC's `totalPass`."
      - name: pass_accuracy_percent
        data_type: double
        description: "Share of the player's passes BBC counts as accurate, from 0 to 100, from BBC's `accuratePassPercentage`."
      - name: total_tackles
        data_type: integer
        description: "Tackles, from BBC's `totalTackle`. Null for most starting goalkeepers."
      - name: tackles_won_percent
        data_type: double
        description: "Share of the player's tackles won, from 0 to 100, from BBC's `wonTacklePercentage`. Null for most starting goalkeepers."
      - name: fouls_committed
        data_type: integer
        description: "Fouls the player committed, from BBC's `fouls`."
      - name: fouls_won
        data_type: integer
        description: "Times the player was fouled, from BBC's `wasFouled`."
      - name: is_starter
        data_type: boolean
        description: "{{ doc('is_starter') }}"
      - name: is_captain
        data_type: boolean
        description: "{{ doc('is_captain') }}"
      - name: has_appeared
        data_type: boolean
        description: "True for starters and for substitutes who came on; false for the unused bench, who are still part of the matchday squad."
        data_tests:
          - not_null

