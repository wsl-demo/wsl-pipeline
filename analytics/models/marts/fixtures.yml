models:
  - name: fixtures
    description: >
      One row per fixture: every match BBC has listed, with its result where
      one exists. A match keeps its opta_match_id from fixture to result.
      Result columns are null while there is no result, which does not mean
      the match is still to come: BBC's fixtures listings are not re-fetched
      once their month has passed.
    config:
      contract:
        enforced: true
    data_tests:
      - expression_is_true:
          arguments:
            expression: "not has_result or (home_points is not null and away_points is not null)"
    columns:
      - name: opta_match_id
        data_type: varchar
        description: "{{ doc('opta_match_id') }}"
        data_tests:
          - unique
          - not_null
      - name: opta_home_team_id
        data_type: varchar
        description: "{{ doc('opta_team_id') }} The home team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: opta_team_id
      - name: opta_away_team_id
        data_type: varchar
        description: "{{ doc('opta_team_id') }} The away team."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: opta_team_id
      - name: has_result
        data_type: boolean
        description: "True when BBC has a result for the match. False says only that no result has been collected, not that the match is still to come."
      - name: season
        data_type: varchar
        description: "{{ doc('season') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('seasons')
                field: season
      - name: matchday
        data_type: integer
        description: >
          The fixture's place in the season's schedule, from 1; every team plays
          once per matchday, though not on the same day. Null when it cannot be
          placed without guessing.
      - name: winner_side
        data_type: varchar
        description: "{{ doc('winner_side') }}"
      - name: tournament_name
        data_type: varchar
        description: "{{ doc('tournament_name') }}"
      - name: venue_name
        data_type: varchar
        description: "{{ doc('venue_name') }}"
      - name: home_score_fulltime
        data_type: integer
        description: "{{ doc('score_fulltime') }} The home team."
      - name: away_score_fulltime
        data_type: integer
        description: "{{ doc('score_fulltime') }} The away team."
      - name: home_points
        data_type: integer
        description: "{{ doc('points') }} The home team."
      - name: away_points
        data_type: integer
        description: "{{ doc('points') }} The away team."
      - name: match_date
        data_type: date
        description: "{{ doc('match_date') }}"
        data_tests:
          - not_null
      - name: kicked_off_at
        data_type: timestamp with time zone
        description: "{{ doc('kicked_off_at') }}"
