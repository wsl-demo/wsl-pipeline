# Checks that need neither the raw CSVs (they live in a private repo) nor a
# built warehouse. Parsing and strict compilation catch broken YAML, unknown
# refs, and SQL functions the dbt engine cannot resolve; running the models and
# their tests stays a local job (`just build`), because that needs the data.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # An empty file is enough: nothing here reads from it.
      DATABASE_NAME: ci.duckdb
      WSL_RAW_DIR: unused
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Parse dbt project
        working-directory: analytics
        run: ../.venv/bin/dbt parse

      - name: Compile with strict static analysis
        working-directory: analytics
        run: ../.venv/bin/dbt compile --static-analysis strict
